name: apsara_app
description: Android-first Flutter frontend for Apsara, a Khmer crafts marketplace.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.0.2
  firebase_core: ^4.0.0
  cloud_firestore: ^6.4.1
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1
  http: ^1.6.0
  intl: ^0.20.2
  provider: ^6.1.5
  share_plus: ^13.1.0
  gal: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/apsara_logo.png
