name: apsara_app
description: Android-first Flutter frontend for Apsara, a Khmer crafts marketplace.
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.0.2
  firebase_core: ^4.0.0
  cloud_firestore: ^6.4.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1
  http: ^1.6.0
  intl: ^0.20.2
  provider: ^6.1.5
  share_plus: ^13.1.0
  gal: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/apsara_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/apsara_logo.png
